<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Visioret mark: retinal contour with the focal point above it. The
       reticle corner ticks from the in-app logo are dropped here because they
       turn to mush at 16px; the contour and focal dot carry the identity. -->
  <rect width="32" height="32" rx="7" fill="#0b0f16" />
  <path
    d="M4 23c4.5 0 6-7 12-7s7.5 7 12 7"
    fill="none"
    stroke="#2dd4f0"
    stroke-width="2.8"
    stroke-linecap="round"
  />
  <circle cx="16" cy="9" r="3.3" fill="#2dd4f0" />
</svg>
