# nginx config for the built React app.
#
# IMPORTANT nginx behaviour, and the reason the security headers below are
# repeated instead of being declared once at server level: add_header does NOT
# merge across levels. If a `location` block contains ANY add_header of its
# own, every add_header inherited from the enclosing server block is
# discarded. Both locations here set Cache-Control, so a single server-level
# declaration of the security headers would apply to neither -- they would
# silently vanish from every response the site actually serves.
#
# The alternative is an include file, which would mean a second COPY in
# frontend/Dockerfile. Repetition is uglier but keeps the deployment surface
# to one file, and the failure mode of getting it wrong is invisible.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in every response. Minor, but free.
    server_tokens off;

    # Vite emits content-hashed filenames (index-CYwRzeL-.js), so a given URL
    # under /assets/ can never change contents. Cache it hard -- and mark it
    # immutable so browsers don't even revalidate.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: http://localhost:8000; connect-src 'self' http://localhost:8000; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        try_files $uri =404;
    }

    # SPA routing: any path that isn't a real file falls back to index.html
    # so React Router can handle it client-side (e.g. /history, /scans/5).
    location / {
        try_files $uri $uri/ /index.html;

        # index.html must NEVER be cached without revalidation. It is the file
        # that names which hashed bundle to load, so a stale copy pins the
        # browser to an old build -- and because the old bundle's filename
        # disappears on the next deploy, that eventually becomes a blank page
        # with "Failed to load module script" rather than merely stale code.
        #
        # nginx sends only ETag/Last-Modified by default, with no
        # Cache-Control. Browsers then apply *heuristic* caching (roughly 10%
        # of the document's age) and can serve index.html from cache without
        # asking the server at all. Observed during review: after a rebuild,
        # the container was serving a new bundle while the browser kept
        # running the previous one.
        #
        # "no-cache" does not mean "don't store" -- it means "always
        # revalidate before use". The ETag makes that a cheap 304 when nothing
        # changed.
        add_header Cache-Control "no-cache" always;

        # --- Security headers ---
        # `always` so they are attached to error responses too, not just 2xx.

        # Refuse to be framed. Visioret shows medical predictions with action
        # controls (a reviewer marking a scan incorrect); embedding it
        # invisibly over another page is a clickjacking route to those.
        add_header X-Frame-Options "DENY" always;

        # Stop MIME sniffing, so nothing served here can be re-interpreted as
        # HTML or script by the browser's guess.
        add_header X-Content-Type-Options "nosniff" always;

        # Don't leak scan URLs to third parties via Referer.
        # /media/scans/<uuid>.jpg IS the capability for that image (see the
        # comment on the StaticFiles mount in backend/main.py), so a referrer
        # leak is a real disclosure rather than a privacy nicety.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Nothing here uses these; deny them outright so a compromised
        # dependency cannot start asking.
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Everything the app needs is same-origin except three things, each
        # allowed deliberately:
        #   - the API and the scan images it serves, on :8000 in this compose
        #     setup (img-src, connect-src);
        #   - the Google Fonts stylesheet (style-src) and the font files it
        #     pulls (font-src) -- index.html loads Inter and IBM Plex Mono
        #     from the CDN. The first version of this CSP omitted both and
        #     silently dropped the app to fallback fonts.
        #
        # script-src stays strict at 'self'. That was NOT free: index.html
        # had an inline theme-bootstrap script, which this policy blocked
        # outright (theming would have flashed on every load). It now lives
        # in public/theme-init.js -- see the reasoning in that file for why
        # an external file beats 'unsafe-inline' or a pinned hash.
        #
        # 'unsafe-inline' remains necessary for style-src because Tailwind
        # and framer-motion set inline styles on elements; there is no way
        # around that short of nonces on every animated node.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: http://localhost:8000; connect-src 'self' http://localhost:8000; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
