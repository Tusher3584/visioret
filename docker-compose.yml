services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: visioret
      POSTGRES_PASSWORD: visioret
      POSTGRES_DB: visioret
    ports:
      - "5433:5432"  # 5432 was already taken by a pre-existing local Postgres service
    volumes:
      - visioret_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visioret"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://visioret:visioret@db:5432/visioret
      # Read from the project-root .env (gitignored), never committed. The
      # `:?` form makes compose ABORT with this message if it is unset, rather
      # than starting with an empty or default key -- a committed or defaulted
      # signing key lets anyone who has read the repo forge a token for any
      # account, including an admin. See backend/auth.py, which refuses to
      # import without it for the same reason.
      #
      # The value is quoted because a bare YAML scalar cannot contain ": " --
      # that sequence makes the parser read it as a nested mapping key.
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?not set - copy .env.example to .env and put a generated key in it, see README}"
    ports:
      - "8000:8000"
    volumes:
      - ./model:/app/model
      - ./backend/media:/app/backend/media
      - visioret_torch_cache:/root/.cache/torch
      - visioret_hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  visioret_pgdata:
  visioret_torch_cache:
  visioret_hf_cache:
